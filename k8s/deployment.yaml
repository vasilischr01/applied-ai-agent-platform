apiVersion: apps/v1
kind: Deployment
metadata:
  name: applied-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: applied-ai-agent
  template:
    metadata:
      labels:
        app: applied-ai-agent
    spec:
      containers:
        - name: applied-ai-agent
          image: applied-ai-agent-platform:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: applied-ai-agent-config

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"